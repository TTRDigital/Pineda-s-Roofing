# Builds the static site and uploads it to SiteGround over FTPS.
# The live site is ALWAYS built from the `live` branch, whatever started the run:
# a push to `live`, a Sanity publish (repository_dispatch) or Actions >
# "Deploy to SiteGround" > Run workflow. Work in progress stays on
# claude/youthful-clarke-wb7b1z, which Vercel shows as the staging site
# (pineda-s-roofing.vercel.app). To go live: merge it into `live`.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SG_FTP_SERVER    FTP host from SiteGround Site Tools > Site > FTP Accounts
#   SG_FTP_USERNAME  FTP account whose folder is the site's public_html
#   SG_FTP_PASSWORD
#   GHL_WEBHOOK_URL  optional: a different GoHighLevel webhook for the form
#                    (public/api/lead.php has the default built in)
name: Deploy to SiteGround

on:
  push:
    branches: [live]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:

concurrency:
  group: deploy-siteground
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # At job level so the steps' `if:` checks can see them.
    env:
      SG_FTP_SERVER: ${{ secrets.SG_FTP_SERVER }}
      GHL_WEBHOOK_URL: ${{ secrets.GHL_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build

      # Download from the run page for a manual upload (no form settings inside).
      - name: Keep a copy of the site
        uses: actions/upload-artifact@v4
        with:
          name: pinedas-roofing-site
          path: out/
          include-hidden-files: true
          retention-days: 14

      # Optional override; without the secret, lead.php uses its built-in webhook.
      - name: Write form settings
        if: env.GHL_WEBHOOK_URL != ''
        run: |
          php -r 'file_put_contents("out/api/lead-config.php", "<?php\nreturn " . var_export(["webhook_url" => getenv("GHL_WEBHOOK_URL")], true) . ";\n");'

      - name: Upload to SiteGround
        # Skipped (build check only) until the FTP secrets are added.
        if: env.SG_FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SG_FTP_SERVER }}
          username: ${{ secrets.SG_FTP_USERNAME }}
          password: ${{ secrets.SG_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./out/
          server-dir: ./
